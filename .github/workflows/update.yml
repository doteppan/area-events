name: ページ自動更新

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 6:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: 各エリアのニュースを取得してページを再生成
        run: TZ=Asia/Tokyo python3 build.py
      - name: 変更があればコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: エリアイベント情報 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git push
          fi
